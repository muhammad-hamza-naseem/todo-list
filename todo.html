<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --danger: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --card: #1b1e25;
        --text: #e6e8eb;
        --muted: #9aa1ab;
        --border: #2c313a;
        --accent: #60a5fa;
        --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    main {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      align-self: flex-start;
    }
    h1 { margin: 0 0 16px; font-size: 1.5rem; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }
    .add {
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
    }
    li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    .delete {
      background: transparent;
      color: var(--muted);
      font-size: 1.2rem;
      padding: 2px 8px;
    }
    .delete:hover { color: var(--danger); }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .clear { background: transparent; color: var(--muted); padding: 4px 0; }
    .clear:hover { color: var(--danger); }
    .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  </style>
</head>
<body>
  <main>
    <h1>To-Do List</h1>
    <form id="form">
      <input id="input" type="text" placeholder="What needs doing?" autocomplete="off" autofocus>
      <button class="add" type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <p id="empty" class="empty">Nothing yet. Add your first task above.</p>
    <footer>
      <span id="count"></span>
      <button id="clear" class="clear" type="button">Clear completed</button>
    </footer>
  </main>

  <script>
    const KEY = "todos";
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");
    const clear = document.getElementById("clear");

    let todos = load();

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; }
      catch { return []; }
    }

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {}
    }

    function render() {
      list.innerHTML = "";
      for (const todo of todos) {
        const li = document.createElement("li");
        if (todo.done) li.className = "done";

        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = todo.done;
        box.addEventListener("change", () => {
          todo.done = box.checked;
          save();
          render();
        });

        const text = document.createElement("span");
        text.textContent = todo.text;

        const del = document.createElement("button");
        del.className = "delete";
        del.type = "button";
        del.title = "Delete";
        del.textContent = "×";
        del.addEventListener("click", () => {
          todos = todos.filter(t => t !== todo);
          save();
          render();
        });

        li.append(box, text, del);
        list.append(li);
      }

      const left = todos.filter(t => !t.done).length;
      empty.hidden = todos.length > 0;
      count.textContent = `${left} item${left === 1 ? "" : "s"} left`;
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = "";
      save();
      render();
    });

    clear.addEventListener("click", () => {
      todos = todos.filter(t => !t.done);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
